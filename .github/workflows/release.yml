name: Release

# Pushing a vX.Y.Z tag builds signed APKs and publishes them as a release. The in-app updater reads the latest
# release (GitHub leaves pre-releases out of it), so a release must not be marked as a pre-release to reach users.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches versionName
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, versionName $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Fetch the Tsunagu core
        run: scripts/fetch-tsunagu.sh

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/moku-release.jks
          {
            echo "storeFile=moku-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build
        working-directory: android
        run: gradle assembleRelease -PsplitAbi

      - name: Collect APKs
        run: |
          mkdir dist
          for apk in android/app/build/outputs/apk/release/app-*-release.apk; do
            variant=$(basename "$apk" -release.apk); variant=${variant#app-}
            cp "$apk" "dist/moku-$VERSION-$variant.apk"
          done
          # An unsigned APK can't update an installed Moku, so a release without the key must not go out.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ls dist/*.apk >/dev/null
          for apk in dist/*.apk; do "$apksigner" verify "$apk" || { echo "$apk is not signed"; exit 1; }; done
          (cd dist && sha256sum *.apk > sha256sums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Moku $VERSION" --generate-notes
